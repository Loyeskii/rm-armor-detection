%YAML:1.0
---
# ============================================================
# 传统视觉方案 · 参数配置
# 所有阈值都可在这里调整，不需要重新编译。
# 第一行必须是 %YAML:1.0（OpenCV FileStorage 的要求）。
# 注意：不要使用跨行的数组，FileStorage 解析不稳定；
#       需要成组的数值请拆成独立的标量键。
# ============================================================

camera:
  # 内参是对这个分辨率标定的；实际图像分辨率不同时，程序按比例缩放 fx/fy/cx/cy。
  # 依据：cx、cy 恰好是 1358x1058 的正中心，而素材图片是 960x720（非等比缩放）。
  calib_width: 1358
  calib_height: 1058
  # 内参矩阵 K = [fx 0 cx; 0 fy cy; 0 0 1]
  fx: 2362.2795952460974
  fy: 2336.1916035376717
  cx: 679.17513921636282
  cy: 529.06858905837635
  # 畸变系数（OpenCV 顺序：k1, k2, p1, p2, k3）
  k1: -0.098561592108101559
  k2: 0.11173066531932681
  p1: -0.0038352945867108721
  p2: -0.0020421443354436304
  k3: 0.0

armor:
  # 装甲板实际尺寸（单位：米）。物方点以板中心为原点。
  # 误差整体呈"等比放大"时，多半就是这个尺寸假设不准。
  small_width: 0.060
  small_height: 0.056
  large_width: 0.225
  large_height: 0.125

detect:
  # bdiff = 通道占优法（推荐）：目标通道比对立通道高出 delta 且自身够亮。
  #         比 HSV 的 S/V 硬阈值宽容，能保住整根灯条不被削成半截。
  # hsv   = HSV 区间分割（备选）
  # gray  = 灰度阈值（真实相机灯条过曝发白时才用）
  mode: bdiff
  binary: 40
  use_blue: 1
  use_red: 1            # 红蓝同时检测：同一块板的配对要求同色，所以互不干扰
  # bdiff 参数：B - R > delta 且 B > min
  bdiff_delta: 12
  bdiff_min: 45
  # hsv 备选参数
  blue_h_min: 100
  blue_h_max: 140
  red1_h_min: 0
  red1_h_max: 10
  red2_h_min: 170
  red2_h_max: 180
  s_min: 120
  v_min: 120

light:
  min_area: 6.0        # 远距离灯条只有 9~12 px 长，面积阈值要小
  min_ratio: 1.8       # 长宽比下限（灯条必须细长）
  max_ratio: 8.0       # 长宽比上限（排除横跨背景的长条）
  max_tilt_deg: 35.0   # 灯条相对竖直方向的最大倾角（比 45° 更严，排除斜向杂光）
  min_fill: 0.50       # 填充率 = 轮廓面积 / 最小外接矩形面积
                       # 灯条与旁边杂光粘连后会变成"不规则块"，填充率明显下降
  end_refine: 0.5
                       # 在灯条自身窄带内按"峰值颜色优势 × 本比例"重新取阈值，
                       # 只保留亮核求端点。0 = 关闭。实测 0.5 能把两根灯条的
                       # 长度差从 20px 压到 3px 以内。
  end_refine_pct: 0.93
                       # 高了远处暗灯条被裁掉（1.jpg 会检不出）。

pair:
  min_length_ratio: 0.75     # 两灯条长度比（短/长）下限
  min_center_dist: 0.7       # 两灯条中心距 / 灯条平均长度
  # 装甲板宽度与灯条长度（≈板高）之比：小装甲板 135/125≈1.08，大装甲板 225/125≈1.8。
  # 上限必须收紧：实测"跨两块板"的错误配对会达到 2.9~4.6。
  max_center_dist: 2.0
  # 宽高比约束（四边框的 宽/高）：正对时≈1.08，斜视时会被压缩。
  # 跨板错配的框又宽又扁，实测 2.9~3.1，必须剔除。
  # 注意：端点精修后灯条只算"亮核"，长度比含光晕时短 10~15%，
  # 框宽高比会随之抬高，因此上限放到 2.2（与 2.9 之间仍有明显间隔）。
  min_aspect: 0.35
  max_aspect: 2.2
  max_tilt_diff_deg: 15.0    # 两灯条倾角之差上限
  max_pair_tilt_deg: 35.0    # 两灯条连线相对水平方向的最大倾斜

thresh:
  binary: 100                # gray 模式的二值化阈值
  min_digit_conf: 0.3        # 数字识别置信度下限
  require_digit: 1           # 1=必须识别出数字才算有效装甲板（数字网络真正参与灯条配对）
  large_armor_ratio: 3.2     # 中心距/灯条长度 超过该比例判为大装甲板
  max_range_m: 15.0          # 解算距离上限，超过视为无效解

model:
  digit_onnx: models/mlp.onnx
  labels: config/labels.txt
  # 数字 ROI 的几何严格按训练时的预处理来：
  #   灯条只占 28 高画布中的 12 像素，画布宽 32(小)/54(大)，再裁中间 20 列 → 20x28
  # 这些常量写在 number_classifier.cpp 里，不开放配置，避免改坏后与训练分布不一致

io:
  video: ../data/original/videos/2026-05-20_23-57-31.avi
  video_out: ../data/processed/A/videos/A_traditional_annotated.mp4
  images_dir: ../data/original/images
  images_out: ../data/processed/A/images
